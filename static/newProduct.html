<link rel="stylesheet" href="/static/layui/css/layui.css">
<body>
<div class="layui-container"></div>
<div style="padding: 16px;"> 
    <div class="layui-form-item">
        <div class="layui-input-group">
          <div class="layui-input-split layui-input-prefix">
            商品名
          </div>
          <input type="text" placeholder="" class="layui-input" id="name">
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-group">
          <div class="layui-input-split layui-input-prefix">
            库存
          </div>
          <input type="text" placeholder="" class="layui-input" id="quantity">
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-group">
          <div class="layui-input-split layui-input-prefix">
            进货价
          </div>
          <input type="text" placeholder="" class="layui-input" id="price1">
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-group">
          <div class="layui-input-split layui-input-prefix">
            零售价
          </div>
          <input type="text" placeholder="" class="layui-input" id="price2">
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-group">
          <div class="layui-input-split layui-input-prefix">
            vip价
          </div>
          <input type="text" placeholder="" class="layui-input" id="price3">
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-group">
          <div class="layui-input-split layui-input-prefix">
            市代价
          </div>
          <input type="text" placeholder="" class="layui-input" id="price4">
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-group">
          <div class="layui-input-split layui-input-prefix">
            省代价
          </div>
          <input type="text" placeholder="" class="layui-input" id="price5">
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-group">
          <div class="layui-input-split layui-input-prefix">
            总代价
          </div>
          <input type="text" placeholder="" class="layui-input" id="price6">
        </div>
    </div>
</div>
</div>
</body>
<script src="/static/layui/layui.js"></script>
